name: One-shot Galil SSOT handoff 2026-10-11

on:
  push:
    branches:
      - chatgpt/galil-workspace-grid
    paths:
      - .github/workflows/ssot-handoff-20261011.yml

permissions:
  contents: write

jobs:
  update-ssot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/galil-workspace-grid
          fetch-depth: 0

      - name: Append canonical Claude handoff and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq '## 28. חידוד 2026-10-11 — משבצות חישוב והעברת מקל ל-Claude Code' SOURCE_OF_TRUTH.md; then
            cat >> SOURCE_OF_TRUTH.md <<'EOF'

          ## 28. חידוד 2026-10-11 — משבצות חישוב והעברת מקל ל-Claude Code
          28.1. יניב חידד במפורש את §16: בשאלות חישוביות מרחב ה„דרך” של התלמיד הוא **רשת משבצות**, לא שורות אופקיות. המבנה הקנוני נשאר: **שאלה → מקום עבודה/משבצות → תשובה**.

          28.2. רשת החישוב המחייבת היא רשת דו-צירית עדינה של **5×5 מ״מ**, קריאה במסך ובהדפסה ונשמרת גם ב-PDF. הכלל חל על רכיב `.work` ועל מרחב A4 אוטומטי שנוסף רק כאשר המשימה האחרונה בדף היא חישובית.

          28.3. אין להחזיר תיבת עבודה גדולה למשימת זיהוי/בחירה קצרה. התיקון האחרון של Claude שהגביל את מרחב ה-A4 האוטומטי לעמודים חישוביים נשמר במלואו; החידוד כאן משנה את **סוג הרקע** של מרחב החישוב מקווים למשבצות, לא את הסיווג של המשימות.

          28.4. המימוש נמצא ב-PR #5, ענף `chatgpt/galil-workspace-grid`, מעל head `eb79218a4b2e782c44ffdad000ce52a613fefa7e` של `claude/galil-work`. לא שונו HTML של עמודים, נוסחי שאלות, נוסחאות, תוכן רשמי נעול, מספר עמודים או ממדים.

          28.5. ראיות לפני עדכון מקור האמת: head `da53f2f61eac2c63ade8d2b0599456733d314ee5`; Galil Workbook QA run #54 עבר בהצלחה: SSOT, contract, מקור/רינדור שאלות רשמיות, core, volume, surface, progress ו-browser A4/mobile/print/PDF.

          28.6. הוראת handoff ל-Claude Code: עם חזרת ה-session, יש לקרוא סעיף זה ואת PR #5 לפני שינוי נוסף. אין לשכתב את commits של Claude ואין להחזיר `repeating-linear-gradient(to bottom...)` כרקע יחיד למרחב חישוב. כל שינוי עתידי חייב לשמור על רשת 5×5 מ״מ ועל ההבחנה בין משימות חישוביות לבין זיהוי/בחירה.

          28.7. כל עוד PR #5 לא מוזג, ענף `claude/galil-work` נשאר בסיס העבודה של Claude; PR #5 הוא שכבה נקייה ומבודדת שנועדה להשתלב מעליו לאחר review/QA, בלי לדרוס עבודה מקומית שלא נשמרה.
          EOF
          fi
          rm -f .github/workflows/ssot-handoff-20261011.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_OF_TRUTH.md .github/workflows/ssot-handoff-20261011.yml
          if ! git diff --cached --quiet; then
            git commit -m 'docs(ssot): record 5x5mm Claude handoff'
            git push origin HEAD:chatgpt/galil-workspace-grid
          fi
