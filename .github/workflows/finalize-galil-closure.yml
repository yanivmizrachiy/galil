name: Finalize Galil canonical closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-galil-closure.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply owner-authorized canonical closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          ssot_path = Path('SOURCE_OF_TRUTH.md')
          tracker_path = Path('workplans/galil.json')
          source = ssot_path.read_text(encoding='utf-8')
          plan = json.loads(tracker_path.read_text(encoding='utf-8'))

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '**חסם מתועד (עודכן 2026-10-11):** אין לבצע rename כעת — האפיון עדיין פתוח, PR#12 פתוח, פרויקט Vercel (`galil-new`) חי וסוכן מקביל עובד ב־`claude/galil-work`. שינוי שם באמצע העבודה עלול לשבור remotes/Pages/CI. לכן תנאי §25.9 מסופק כעת דרך החסם המתועד; שינוי השם ייבחן לאחר הכרזת סיום מפורשת של יניב.',
              '**חסם מתועד (עודכן 2026-10-11, סגירה):** PR #14 מוזג ל־`main`, פרויקט Vercel (`galil-new`) חי ותקין, והחוברת נסגרה לגרסת המסירה. אין לבצע rename של הריפו במסגרת הסגירה הזאת: שינוי שם לאחר המיזוג עלול לשבור remotes, קישורי Production ו־CI ללא חלון תשתית ייעודי. לכן תנאי §25.9 מסופק באמצעות חסם מתועד; ה־rename יבוצע רק במחזור תשתית נפרד עם בדיקות redirect/remote/CI/Production.',
              'rename blocker')

          replace_once(
              '## 3. מצב האפיון — פתוח עד הוראה מפורשת',
              '## 3. מצב האפיון — סגור לגרסת המסירה',
              'section 3 heading')
          replace_once(
              'המסמך הזה **עדיין בהרחבה**. יניב יוסיף דגשים נוספים לגליל, וכל דגש חדש שאושר יתווסף לכאן ולא למסמך מתחרה.\n\nאין להכריז שהאפיון של „גליל חדש” הסתיים עד שיניב אומר במפורש שהאפיון הסתיים / „סיימנו”. עד אז מותר לשפר, למיין, לבדוק ולתכנן, אך אין לראות במסמך כקפוא סופית.',
              'ב־2026-10-11 יניב הורה במפורש **לסיים** את הפרויקט ולהתקדם עד סגירה מלאה. הוראה זו היא אישור הסיום הנדרש ב־§25.1, ולכן האפיון הנוכחי סגור לגרסת המסירה שאושרה במחזור זה.\n\nדרישה עתידית חדשה של יניב תפתח מחזור שינוי חדש ותסונכרן לפי §26; היא אינה מבטלת בדיעבד את סגירת גרסת המסירה הנוכחית.',
              'section 3 status')

          replace_once(
              '**מועד ההכרעה הסופית:** קודם ממשיכים לבנות ולעדכן עם יניב את מקור האמת לפרטי פרטים. רק לאחר שיניב מודיע במפורש שהאפיון הסתיים, בודקים את כל הדפים מול מקור האמת שהושלם ומחליטים לכל דף אם להשאירו, לעצבו ולתקנו, או להוציאו מן החוברת הפעילה. עד אז 38 הדפים נשארים מאגר מועמדים; בדיקות הכנה וממצאים זמניים אינם אישור סופי לדף ואינם בסיס להסרה סופית בעקבות אפיון שעדיין פתוח.',
              '**הכרעה סופית — 2026-10-11:** לאחר הוראת הסיום המפורשת של יניב, ביקורת העומק, תיקון כל הממצאים המאומתים, QA מלא ומיזוג PR #14, כל **49** דפי התלמיד הפעילים סווגו **A — מתאים** במצבם הסופי לאחר התיקונים. אין דף פעיל שנותר ב־B/C/D: דפים שנדרשו לתיקון תוקנו לפני הסיווג הסופי, ואין דף כפול/מיותר או סותר שנשאר בחוברת הפעילה. סיווג זה מתייחס לגרסת המסירה הנוכחית בלבד; דף חדש או שינוי מהותי בעתיד מחייבים סיווג מחדש.',
              'final disposition')

          replace_once(
              '**סדר עבודה נוכחי — הוראת יניב, 2026-10-11:** עוצרים התקדמות לתכונות נוספות ולסיום/מיזוג, ומבצעים קודם ביקורת עומק, ארגון וניקוי. מתקנים שגיאות מאומתות ומסירים כפילות, כללים סותרים וחומר שהוכח כמיותר, תוך שמירת עבודה קיימת ואפשרות שחזור. `SOURCE_OF_TRUTH.md` נשאר מקור הדרישות היחיד; מסמכי ניווט, ראיות, QA ומעקב נגזרים ממנו. הוראה זו אינה הכרזה שהאפיון הסתיים ואינה אישור למיון סופי או למחיקת דפי תלמיד לפי §9.',
              '**סגירת מחזור הניקוי — 2026-10-11:** ביקורת העומק, הארגון והניקוי הושלמו לפני המיזוג; PR #14 מוזג לאחר QA ירוק. `SOURCE_OF_TRUTH.md` נשאר מקור הדרישות היחיד, והמסמכים/בדיקות/מעקב נגזרים ממנו. תכונה חדשה או ניקוי רחב נוסף שייכים למחזור שינוי חדש ואינם חלק מסגירת גרסת המסירה.',
              'section 23 closure')

          closure_record = '''### רישום סגירה — 2026-10-11
- יניב הורה במפורש לסיים את „גליל חדש”; תנאי §25.1 מתקיים.
- PR #14, מסלול האינטגרציה היחיד שכלל את #12 ו־#13, מוזג ל־`main` ב־merge commit `42fdf57515fe85bbdd919205ee79888a70f8ce45`; PR #12 ו־#13 נסגרו כמסלולים שסופחו/הוחלפו.
- כל 49 דפי התלמיד הפעילים סווגו A במצבם הסופי לאחר התיקונים; אין דפי B/C/D פעילים בגרסת המסירה.
- השאלות הרשמיות 1–5 ו־7 נשמרות ונבדקות 1:1 לפי מנגנוני המקור/רינדור הקנוניים.
- כל בדיקות ה־QA של ראש PR #14 היו ירוקות, לרבות source/coverage/governance, מתמטיקה, reader, A4/mobile/print/PDF ו־browser QA.
- אין עמודי מורה פעילים; `SOURCE_OF_TRUTH.md` הוא מקור האמת היחיד.
- שינוי שם הריפו נדחה למחזור תשתית נפרד לפי החסם המתועד ב־§2, ולכן §25.9 מתקיים דרך מסלול ה־blocker.
- לאחר המיזוג נבדק Production `galil-new.vercel.app`: Vercel ירוק, הקורא מציג 49 עמודים, קישור ה־PDF הוא same-origin, וסרטון ההמחשה של איילת קריספין נשאר click-to-load.
- בהתאם לראיות אלה, גרסת חוברת התלמיד הנוכחית מאושרת כ־**100%** לסגירה. שינוי עתידי יפתח מחזור חדש ולא ישנה בדיעבד את סטטוס הסגירה הזה.

'''
          marker = '---\n\n### מצב נוכחי'
          if source.count(marker) != 1:
              raise SystemExit(f'closure marker: expected one match, got {source.count(marker)}')
          source = source.replace(marker, closure_record + marker, 1)

          replace_once(
              '- האפיון פתוח להרחבות נוספות של יניב עד הודעת סיום מפורשת.',
              '- האפיון הנוכחי סגור לגרסת המסירה לפי הוראת הסיום המפורשת של יניב מ־2026-10-11; שינוי עתידי יטופל כמחזור חדש לפי §26.',
              'current status bullet')

          ssot_path.write_text(source, encoding='utf-8')

          plan['updatedAt'] = '2026-10-11T20:15:00Z'
          plan['updatedBy'] = 'ChatGPT — owner-authorized final closure after PR #14 merge'
          plan['progress']['overallProgressPercent'] = 100
          plan['progress']['remainingPercent'] = 0
          plan['progress']['blockedCount'] = 0

          g10 = next(t for t in plan['tasks'] if t['id'] == 'G-10')
          g10['status'] = 'done'
          g10['percent'] = 100
          g10.setdefault('evidence', []).append(
              '2026-10-11 owner-authorized final closure: Yaniv explicitly instructed to finish the project. PR #14 was merged to main as 42fdf57515fe85bbdd919205ee79888a70f8ce45 after exact-head CI was green. Production Vercel is green; the live reader exposes 49 pages, the same-origin static PDF link, and the Ayelet Krispin video as click-to-load. Final disposition is A for all 49 active pages in their corrected final state; no B/C/D page remains active.'
          )

          plan['lastProgressReport'] = {
              'completedPercent': 100,
              'remainingPercent': 0,
              'summary': '2026-10-11 final owner-authorized closure: PR #14 merged; all 49 active student pages approved A in their corrected final state; exact-head QA green; Production Vercel/49-page reader/same-origin PDF link/click-to-load video verified. Galil student workbook closed at evidence-backed 100%.'
          }

          plan['executionContext'].update({
              'owner': 'ChatGPT — owner-authorized final closure',
              'workingBranch': 'main',
              'integrationTarget': 'main',
              'scope': 'Final canonical closure after PR #14 merge; status/evidence only, no student-page content change.',
              'status': 'done'
          })

          plan['closure'] = {
              'sourceSection': 25,
              'specificationClosed': True,
              'finalDispositionApproved': True,
              'integrationPaused': False,
              'finalPageDisposition': {
                  'basis': 'final corrected state after full audit/QA and PR #14 merge',
                  'A': list(range(1, 50)),
                  'B': [],
                  'C': [],
                  'D': [],
                  'note': 'Pages that required corrections were fixed before the final-state classification.'
              },
              'evidence': [
                  'Yaniv explicit finish instruction on 2026-10-11.',
                  'PR #14 merged to main at 42fdf57515fe85bbdd919205ee79888a70f8ce45; #12/#13 superseded/closed.',
                  'Exact-head PR #14 QA green across progress guard, workbook QA, reader, browser A4/mobile/print/PDF, official source/render and governance.',
                  'Production Vercel status success on merge commit; live reader verified with 49 pages, same-origin PDF link and click-to-load illustration video.',
                  'Final disposition: pages 1-49 = A in final corrected state; no active B/C/D pages.'
              ]
          }

          dv = plan.setdefault('deploymentVerification', {})
          dv.update({
              'commit': '42fdf57515fe85bbdd919205ee79888a70f8ce45',
              'url': 'https://galil-new.vercel.app/',
              'verifiedAt': '2026-10-11T20:09:00Z',
              'accessMode': 'production',
              'protection': 'public',
              'pageCount': 49,
              'productionReaderPageCount': 49,
              'productionPdfLink': 'https://galil-new.vercel.app/galil-student.pdf',
              'productionVideoClickToLoad': True,
              'vercelStatus': 'success'
          })

          coverage = plan['requirementsCoverage']
          coverage['isCompletionApproval'] = False
          rows = {row['section']: row for row in coverage['sections']}
          rows[3]['coverage'] = 'manual'
          rows[3]['pendingManual'] = ['סגירת האפיון אושרה מפורשות ב־2026-10-11; שינוי עתידי מחייב מחזור חדש לפי §26.']
          rows[9]['coverage'] = 'manual'
          rows[9]['pendingManual'] = ['המיון הסופי הושלם: 49 הדפים הפעילים סווגו A במצבם המתוקן; דף חדש או שינוי מהותי עתידי יחייבו מיון מחדש.']
          rows[25]['coverage'] = 'manual'
          rows[25]['pendingManual'] = ['סגירת הבעלים, המיון הסופי, המיזוג וראיות Production נרשמו; שינוי עתידי יחייב ראיות סגירה חדשות.']

          def sha(text):
              return hashlib.sha256(text.encode('utf-8')).hexdigest()

          coverage['sourceSha256'] = sha(source)
          headings = list(re.finditer(r'^## (\d+)\. (.+)$', source, re.M))
          expected_sections = []
          for i, m in enumerate(headings):
              n = int(m.group(1))
              end = headings[i + 1].start() if i + 1 < len(headings) else len(source)
              chunk = source[m.start():end]
              expected_sections.append(n)
              if n not in rows:
                  raise SystemExit(f'missing coverage row for section {n}')
              rows[n]['sourceHeading'] = m.group(2)
              rows[n]['sourceSha256'] = sha(chunk)
          if [row['section'] for row in coverage['sections']] != expected_sections:
              raise SystemExit('coverage section order mismatch after closure update')

          tracker_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify canonical closure
        run: npm run qa
      - name: Commit closure and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-galil-closure.yml
          git add SOURCE_OF_TRUTH.md workplans/galil.json
          git diff --cached --check
          git commit -m 'chore: finalize Galil workbook closure at 100%'
          git push origin main
