name: Reader separator hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reader-separator-hotfix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SSOT and reader contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ssot = Path('SOURCE_OF_TRUTH.md')
          s = ssot.read_text(encoding='utf-8')
          footer_anchor = 'עקרונות שכבר הוכיחו עצמם ב„חרוט חדש” עוברים לכאן כאשר הם מתאימים: RTL מלא, טיפוגרפיה עברית ברורה, כותרות לא כבדות מדי, ריווח מאוזן, footer מחוזי אחיד, צבעים עקביים, כפתורי ניווט ברורים ותצוגת מובייל שאינה שוברת את A4.'
          footer_rule = '\n\n**קו כחול מעל הכותרת התחתונה — דרישה מחייבת של יניב (2026-10-11):** בכל דף A4 מופיע מעל טקסט ה־footer/הכותרת התחתונה קו כחול אחיד לכל רוחב הדף, מקצה לקצה. מותר להכניס את טקסט ה־footer פנימה בשוליים, אך הקו עצמו חייב להישאר ברוחב מלא.'
          if footer_rule.strip() not in s:
              assert footer_anchor in s
              s = s.replace(footer_anchor, footer_anchor + footer_rule, 1)
          scroll_old = '- הגלילה חלקה וטבעית: `scroll-snap` עדין מסוג `proximity` (לא כופה), הפרדה ויזואלית ברורה בין הדפים, וטעינה הדרגתית (`lazy`) בלי קפיצות פריסה.'
          scroll_new = '- מיד עם פתיחת הקישור ניתן לגלול אנכית כלפי מטה ברצף את כל הדפים. הגלילה חלקה וטבעית: `scroll-snap` עדין מסוג `proximity` (לא כופה) וטעינה הדרגתית (`lazy`) בלי קפיצות פריסה. **בין דף לדף אין שום כותרת/תווית כגון „עמוד X מתוך N”; ההפרדה היחידה בתצוגה היא קו כחול מלא לכל רוחב אזור הדף.** הטקסט „עמוד X מתוך N” מותר רק בתוך בורר העמוד ה־sticky.'
          if scroll_new not in s:
              assert scroll_old in s
              s = s.replace(scroll_old, scroll_new, 1)
          ssot.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          old_card = '.sheet-card{margin:0 0 26px;scroll-snap-align:start;scroll-margin-top:calc(var(--bar-h) + 10px);max-width:100%}\n    .sheet-card:last-child{margin-bottom:0}\n    .sheet-label{font-weight:700;text-align:center;margin:0 0 9px;color:#52627a;font-size:14px;\n                 display:flex;align-items:center;justify-content:center;gap:12px}\n    .sheet-label::before,.sheet-label::after{content:"";flex:1;max-width:120px;height:1px;background:#d2dbe8}'
          new_card = '.sheet-card{margin:0 0 26px;padding-bottom:20px;border-bottom:3px solid #1d4ed8;scroll-snap-align:start;scroll-margin-top:calc(var(--bar-h) + 10px);max-width:100%}\n    .sheet-card:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}'
          if new_card not in h:
              assert old_card in h
              h = h.replace(old_card, new_card, 1)
          old_label = '''        const label = document.createElement('div');\n        label.className = 'sheet-label';\n        label.textContent = `עמוד ${n} מתוך ${total}`;\n\n'''
          if old_label in h:
              h = h.replace(old_label, '', 1)
          h = h.replace('        card.append(label, iframe);', '        card.append(iframe);')
          h = h.replace('@media print{ .bar{display:none} body{background:#fff} iframe{box-shadow:none;border:none} }', '@media print{ .bar{display:none} body{background:#fff} .sheet-card{border-bottom:0;padding-bottom:0} iframe{box-shadow:none;border:none} }')
          idx.write_text(h, encoding='utf-8')

          rqa = Path('reader-qa.mjs')
          q = rqa.read_text(encoding='utf-8')
          anchor = "ok(/scroll-snap-align/.test(html), 'each page card must declare scroll-snap-align');"
          extra = "\nok(!html.includes('sheet-label'), 'reader must not show per-page labels such as עמוד X מתוך N; that text belongs only in the sticky selector');\nok(/\\.sheet-card\\{[^}]*border-bottom:3px solid #1d4ed8/.test(html), 'reader must separate pages only with a full-width blue line');"
          if 'reader must not show per-page labels' not in q:
              assert anchor in q
              q = q.replace(anchor, anchor + extra, 1)
          rqa.write_text(q, encoding='utf-8')

          qa = Path('qa.mjs')
          q = qa.read_text(encoding='utf-8')
          qa_anchor = "assert(/white-space:pre-line/.test(css), 'credit footer must render as two lines');"
          qa_extra = "\nassert(/\\.a4-page::after\\{[^}]*right:0;left:0;[^}]*border-top:\\s*2px solid #1e3a8a/.test(css), 'district footer must have a full-width blue rule above the footer text');"
          if 'full-width blue rule above the footer text' not in q:
              assert qa_anchor in q
              q = q.replace(qa_anchor, qa_anchor + qa_extra, 1)
          qa.write_text(q, encoding='utf-8')

          tracker = Path('workplans/galil.json')
          d = json.loads(tracker.read_text(encoding='utf-8'))
          d['updatedAt'] = '2026-10-11T11:12:00+03:00'
          d['updatedBy'] = 'ChatGPT direct repo agent'
          note = '2026-10-11: Yaniv reader/footer requirement recorded canonically: SSOT §17 requires a full-width blue rule above the district footer text; SSOT §19 requires immediate continuous downward scrolling, no per-page “עמוד X מתוך N” labels between pages, a full-width blue-only page separator, and keeps page-count text only in the sticky selector. QA gates were strengthened in the same work cycle. Overall remains 98% because §25 reserved closure conditions are unchanged.'
          g1 = next(t for t in d['tasks'] if t['id']=='G-01')
          if note not in g1['evidence']:
              g1['evidence'].append(note)
          d['progress']['overallProgressPercent'] = 98
          d['progress']['remainingPercent'] = 2
          tracker.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify
        run: npm run qa
      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name "ChatGPT Repo Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/reader-separator-hotfix.yml
          git add SOURCE_OF_TRUTH.md workplans/galil.json index.html reader-qa.mjs qa.mjs
          git commit -m "fix(reader): blue-only page separators and full-width footer rule"
          git push origin HEAD:main
