name: One-shot refine question dots
on:
  push:
    branches: [chatgpt/refine-question-dots]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/refine-question-dots
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Apply precise single-dot refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          cssp=Path('styles.css')
          css=cssp.read_text(encoding='utf-8')
          replacements={
            '.a4-page .task-row>.task-num{font-size:0;line-height:0;background:#1d4ed8;border-color:#1d4ed8}':
            '.a4-page .task-row>.task-num{font-size:0;line-height:0;flex:0 0 4.2mm;width:4.2mm;height:4.2mm;margin-top:.6mm;background:#1d4ed8;border-color:#1d4ed8}',
            '.a4-page .task-row>.task-num::after{content:"";width:2.3mm;height:2.3mm;border-radius:50%;background:#fff}\n':'',
            '.a4-page .q-item .q-num{font-size:0;line-height:0;display:inline-grid;place-items:center;vertical-align:middle;min-width:0;width:4.2mm;height:4.2mm;margin-inline-end:1.5mm;border-radius:50%;background:#1d4ed8}':
            '.a4-page .q-item .q-num{font-size:0;line-height:0;display:inline-block;vertical-align:middle;min-width:0;width:3.2mm;height:3.2mm;margin-inline-end:1.2mm;border-radius:50%;background:#1d4ed8}',
            '.a4-page .q-item .q-num::after{content:"";width:1.5mm;height:1.5mm;border-radius:50%;background:#fff}\n':'',
            '.a4-page.official-page .official-q>p>b:first-child{display:inline-grid;place-items:center;vertical-align:middle;width:7mm;height:7mm;margin-inline-end:2mm;border-radius:50%;background:#1d4ed8;color:transparent;font-size:0;line-height:0}':
            '.a4-page.official-page .official-q>p>b:first-child{display:inline-block;vertical-align:middle;width:4.2mm;height:4.2mm;margin-inline-end:1.4mm;border-radius:50%;background:#1d4ed8;color:transparent;font-size:0;line-height:0}',
            '.a4-page.official-page .official-q>p>b:first-child::after{content:"";width:2.3mm;height:2.3mm;border-radius:50%;background:#fff}\n':'',
            '.a4-page.official-page .q-item .q-text>b:first-child{display:inline-grid;place-items:center;vertical-align:middle;width:4.2mm;height:4.2mm;margin-inline-end:1.5mm;border-radius:50%;background:#1d4ed8;color:transparent;font-size:0;line-height:0}':
            '.a4-page.official-page .q-item .q-text>b:first-child{display:inline-block;vertical-align:middle;width:3.2mm;height:3.2mm;margin-inline-end:1.2mm;border-radius:50%;background:#1d4ed8;color:transparent;font-size:0;line-height:0}',
            '.a4-page.official-page .q-item .q-text>b:first-child::after{content:"";width:1.5mm;height:1.5mm;border-radius:50%;background:#fff}\n':'',
            '.a4-page.official-page .official-q>p:has(>b:first-child)~p>b:first-child,.a4-page.official-page .official-q~.official-q>p>b:first-child{width:4.2mm;height:4.2mm;margin-inline-end:1.5mm}':
            '.a4-page.official-page .official-q>p:has(>b:first-child)~p>b:first-child,.a4-page.official-page .official-q~.official-q>p>b:first-child{width:3.2mm;height:3.2mm;margin-inline-end:1.2mm}',
            '.a4-page.official-page .official-q>p:has(>b:first-child)~p>b:first-child::after,.a4-page.official-page .official-q~.official-q>p>b:first-child::after{width:1.5mm;height:1.5mm}\n':''
          }
          for old,new in replacements.items():
              if old not in css:
                  raise SystemExit('Galil marker CSS anchor missing; refusing broad rewrite: '+old[:70])
              css=css.replace(old,new,1)
          cssp.write_text(css,encoding='utf-8')

          ssotp=Path('SOURCE_OF_TRUTH.md')
          ssot=ssotp.read_text(encoding='utf-8')
          old='כל שאלה ראשית נפתחת בסמן **עגול כחול בולט** במקום מספר; סעיפי משנה מקבלים סמן עגול כחול קטן יותר במקום אות/מספר גלוי כאשר זהו מבנה התצוגה המאושר.'
          new='כל שאלה ראשית נפתחת בסמן **עגול כחול יחיד, מלא וקטן** במקום מספר — עיגול אחד בלבד, ללא עיגול פנימי/חור לבן וללא טבעת כפולה; סעיפי משנה מקבלים עיגול כחול יחיד קטן יותר במקום אות/מספר גלוי כאשר זהו מבנה התצוגה המאושר.'
          if old not in ssot:
              raise SystemExit('Galil SSOT marker sentence missing')
          ssot=ssot.replace(old,new,1)
          ssotp.write_text(ssot,encoding='utf-8')

          qap=Path('qa.mjs')
          qa=qap.read_text(encoding='utf-8')
          old1="assert(/\\.a4-page \\.task-row>\\.task-num\\{font-size:0;line-height:0;background:#1d4ed8;border-color:#1d4ed8\\}/.test(css) && /\\.a4-page \\.task-row>\\.task-num::after\\{content:\"\";[^}]*border-radius:50%/.test(css), 'question markers must render as prominent blue circles without visible digits (CSS only)');"
          new1="assert(/\\.a4-page \\.task-row>\\.task-num\\{font-size:0;line-height:0;flex:0 0 4\\.2mm;width:4\\.2mm;height:4\\.2mm[^}]*background:#1d4ed8/.test(css), 'question markers must render as compact single solid blue dots without visible digits');"
          old2="assert(/\\.a4-page \\.q-item \\.q-num\\{font-size:0;line-height:0;[^}]*border-radius:50%;background:#1d4ed8\\}/.test(css) && /\\.a4-page \\.q-item \\.q-num::after\\{content:\"\";[^}]*border-radius:50%/.test(css), 'sub-section markers must render as smaller blue circles without visible letters (CSS only)');"
          new2="assert(/\\.a4-page \\.q-item \\.q-num\\{font-size:0;line-height:0;[^}]*width:3\\.2mm;height:3\\.2mm[^}]*border-radius:50%;background:#1d4ed8\\}/.test(css), 'sub-section markers must render as smaller single solid blue dots without visible letters');"
          old3="assert(/\\.a4-page\\.official-page \\.official-q>p>b:first-child\\{[^}]*border-radius:50%;background:#1d4ed8;color:transparent;font-size:0/.test(css) && /\\.a4-page\\.official-page \\.q-item \\.q-text>b:first-child\\{[^}]*width:4\\.2mm/.test(css), 'official pages 44-49 must also use display-level blue markers (big question / small sub-section) without altering the locked wording');"
          new3="assert(/\\.a4-page\\.official-page \\.official-q>p>b:first-child\\{[^}]*width:4\\.2mm;height:4\\.2mm[^}]*background:#1d4ed8/.test(css) && /\\.a4-page\\.official-page \\.q-item \\.q-text>b:first-child\\{[^}]*width:3\\.2mm;height:3\\.2mm/.test(css), 'official pages 44-49 must use compact single solid blue markers without altering locked wording');"
          old4="assert(/\\.official-q>p:has\\(>b:first-child\\)~p>b:first-child,[^{]*\\.official-q~\\.official-q>p>b:first-child\\{width:4\\.2mm/.test(css), 'official later parts (a <p> after the question marker, or a following .official-q section — pages 47/49 part ב) must get the small sub-section marker');"
          new4="assert(/\\.official-q>p:has\\(>b:first-child\\)~p>b:first-child,[^{]*\\.official-q~\\.official-q>p>b:first-child\\{width:3\\.2mm/.test(css), 'official later parts must get the small compact marker');"
          for old,new in [(old1,new1),(old2,new2),(old3,new3),(old4,new4)]:
              if old not in qa:
                  raise SystemExit('Galil QA marker assertion anchor missing')
              qa=qa.replace(old,new,1)
          insert="assert(!/\\.task-num::after|\\.q-num::after|official-q>p>b:first-child::after|q-text>b:first-child::after/.test(css), 'nested/inner marker circles are forbidden');\n"
          anchor="assert(!/\\.page-number\\{[^}]*font-size:0/.test(css), 'page numbers must remain visible digits');"
          if insert not in qa:
              qa=qa.replace(anchor,insert+anchor,1)
          qap.write_text(qa,encoding='utf-8')

          tracker=Path('workplans/galil.json')
          data=json.loads(tracker.read_text(encoding='utf-8'))
          data['updatedAt']='2026-10-11T16:35:00+03:00'
          for t in data.get('tasks',[]):
              if t.get('id')=='G-08':
                  note='2026-10-11: Yaniv corrected marker styling: one compact solid blue dot only, no inner white dot/ring. Main question markers reduced to 4.2mm; subsection markers to 3.2mm; official locked wording remains untouched. QA now forbids nested marker circles.'
                  if note not in t.setdefault('evidence',[]): t['evidence'].append(note)
          tracker.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Static QA
        run: npm run qa
      - name: Browser QA
        run: npm run qa:browser
      - name: Rebuild PDF
        run: npm run build:pdf
      - name: Recheck reader/PDF freshness
        run: node reader-qa.mjs
      - name: Commit verified refinement
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-refine-question-dots.yml
          git config user.name "chatgpt-repo-agent"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "fix(student): use smaller single solid question dots"
          git push origin HEAD:chatgpt/refine-question-dots
