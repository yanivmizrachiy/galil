name: Finalize Galil closure (one-shot)

on:
  push:
    branches:
      - claude/galil-closure-20261011
    paths:
      - .github/workflows/fix-cover-binary.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare canonical closure candidate
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('assets/cover-bg.webp'); b=p.read_bytes(); p.write_bytes(re.sub(rb'[^A-Za-z0-9+/=]',b'',b)) if b.startswith(b'UklGR') else None"
          python3 scripts/finalize-cover.py
          python3 scripts/fix-closure-fixtures.py
          python3 -c "import json; p='workplans/galil.json'; d=json.load(open(p,encoding='utf-8')); c=d.setdefault('closure',{}); c['specificationClosed']=True; c['finalDispositionApproved']=True; c['evidence']=['Yaniv explicitly instructed final project completion on 2026-10-11; SSOT section 3 records release closure.','page-disposition.json records a final A/B/C/D decision for all 49 active student pages.','Approved unnumbered Galil cover is integrated and the downloadable workbook is 50 A4 sheets: cover plus 49 numbered student pages.','Repository rename remains deferred only under the documented SSOT section 2 infrastructure blocker.']; open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build cover-inclusive PDF
        run: node scripts/build-pdf.mjs
      - name: Run full static QA
        run: npm run qa
      - name: Run browser A4 mobile print PDF QA
        run: node browser-qa.mjs
      - name: Prepare pushable validated state
        run: |
          rm -f scripts/finalize-cover.py scripts/fix-closure-fixtures.py
          rm -f assets/cover-note.txt assets/cover-image-readme.md assets/cover-bg.b64
          git checkout HEAD -- .github/workflows/qa.yml
      - name: Commit and push validated product state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(closure): approved cover, final disposition and validated 50-sheet Galil workbook'
          git push
