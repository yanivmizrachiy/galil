name: Finalize Galil closure branch

on:
  push:
    branches:
      - chatgpt/finalize-galil-closure-2

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Apply final canonical closure
        run: python scripts/finalize-closure.py
      - name: Harden governance closure fixtures for a 100% baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('governance-qa.mjs')
          s = p.read_text(encoding='utf-8')
          old1 = "trackerMutation(allDone, () => reject('scripts/verify-progress.mjs', /100% requires recorded specification closure/));"
          new1 = "trackerMutation(tracker => { allDone(tracker); tracker.closure.specificationClosed = false; tracker.closure.finalDispositionApproved = false; tracker.closure.evidence = []; }, () => reject('scripts/verify-progress.mjs', /100% requires recorded specification closure/));"
          old2 = "trackerMutation(tracker => { allDone(tracker); tracker.closure.specificationClosed = true; }, () =>\n    reject('scripts/verify-progress.mjs', /100% requires approved final page disposition/));"
          new2 = "trackerMutation(tracker => { allDone(tracker); tracker.closure.specificationClosed = true; tracker.closure.finalDispositionApproved = false; tracker.closure.evidence = []; }, () =>\n    reject('scripts/verify-progress.mjs', /100% requires approved final page disposition/));"
          old3 = "trackerMutation(tracker => { allDone(tracker); tracker.closure.specificationClosed = true; tracker.closure.finalDispositionApproved = true; }, () =>\n    reject('scripts/verify-progress.mjs', /100% requires closure evidence/));"
          new3 = "trackerMutation(tracker => { allDone(tracker); tracker.closure.specificationClosed = true; tracker.closure.finalDispositionApproved = true; tracker.closure.evidence = []; }, () =>\n    reject('scripts/verify-progress.mjs', /100% requires closure evidence/));"
          for old, new, label in [(old1,new1,'spec fixture'),(old2,new2,'disposition fixture'),(old3,new3,'evidence fixture')]:
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, got {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary helpers before governance QA
        shell: bash
        run: |
          git rm scripts/finalize-closure.py .github/workflows/finalize-closure-branch.yml .github/workflows/finalize-galil-closure.yml
      - name: Run canonical QA
        run: npm run qa
      - name: Commit verified closure
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_OF_TRUTH.md workplans/galil.json governance-qa.mjs
          git diff --cached --check
          git commit -m 'chore: finalize Galil workbook closure at 100%'
          git push origin HEAD:chatgpt/finalize-galil-closure-2
